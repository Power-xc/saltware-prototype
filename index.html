<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>솔트웨어 개편 프로토타입</title>

<style>
  :root {
    --page: #fbfbfd;
    --band: #f5f5f7;
    --card: #fff;
    --dark: #1d1d1f;
    --ink: #1d1d1f;
    --ink-2: #424245;
    --muted: #6e6e73;
    --faint: #86868b;
    --hair: rgba(0, 0, 0, 0.09);
    --hair-2: rgba(0, 0, 0, 0.055);
    --sel: #e3e3e5;
    --ph: #e8e8ed;
    --ph-2: #dedee3;
    --line: #c7c7cc;
    --accent: #f49f20;
    --accent-ink: #8a5605;
    --accent-bg: #fdf4e4;
    --accent-line: #f0cf9a;
    --err: #b1362e;
    --err-bg: #fbeceb;
    --err-line: #eec4c0;
    --ok: #1c7a53;
    --onD: #f5f5f7;
    --onD2: rgba(255, 255, 255, 0.62);
    --onDh: rgba(255, 255, 255, 0.18);
    --shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0d0d0f;
      --band: #151517;
      --card: #1b1b1e;
      --dark: #000;
      --ink: #f5f5f7;
      --ink-2: #d2d2d7;
      --muted: #a1a1a6;
      --faint: #86868b;
      --hair: rgba(255, 255, 255, 0.14);
      --hair-2: rgba(255, 255, 255, 0.08);
      --sel: #3a3a3e;
      --ph: #26262a;
      --ph-2: #2f2f34;
      --line: #48484d;
      --accent: #f5b14a;
      --accent-ink: #f5c887;
      --accent-bg: #241c10;
      --accent-line: #5d4519;
      --err: #e8837a;
      --err-bg: #2a1614;
      --err-line: #5e2f2a;
      --ok: #5cbf98;
      --onD: #f5f5f7;
      --onD2: rgba(255, 255, 255, 0.6);
      --onDh: rgba(255, 255, 255, 0.16);
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --page: #0d0d0f;
    --band: #151517;
    --card: #1b1b1e;
    --dark: #000;
    --ink: #f5f5f7;
    --ink-2: #d2d2d7;
    --muted: #a1a1a6;
    --faint: #86868b;
    --hair: rgba(255, 255, 255, 0.14);
    --hair-2: rgba(255, 255, 255, 0.08);
    --sel: #3a3a3e;
    --ph: #26262a;
    --ph-2: #2f2f34;
    --line: #48484d;
    --accent: #f5b14a;
    --accent-ink: #f5c887;
    --accent-bg: #241c10;
    --accent-line: #5d4519;
    --err: #e8837a;
    --err-bg: #2a1614;
    --err-line: #5e2f2a;
    --ok: #5cbf98;
    --onD: #f5f5f7;
    --onD2: rgba(255, 255, 255, 0.6);
    --onDh: rgba(255, 255, 255, 0.16);
    --shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: var(--page);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-family:
      "Pretendard Variable",
      Pretendard,
      -apple-system,
      BlinkMacSystemFont,
      "Apple SD Gothic Neo",
      system-ui,
      "Noto Sans KR",
      sans-serif;
    letter-spacing: -0.01em;
    font-size: 15px;
    line-height: 1.6;
  }
  ::selection {
    background: var(--sel);
  }
  a {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
    border-radius: 6px;
  }
  h1,
  h2,
  h3 {
    text-wrap: balance;
    font-weight: 700;
    letter-spacing: -0.032em;
    line-height: 1.3;
  }
  .ct {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 32px;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85em;
    background: var(--band);
    border: 1px solid var(--hair);
    border-radius: 5px;
    padding: 1px 5px;
    color: var(--ink-2);
  }

  /* ── 프로토타입 배너 ── */
  #proto-bar {
    position: sticky;
    top: 0;
    z-index: 60;
    background: var(--accent-bg);
    border-bottom: 1px solid var(--accent-line);
    font-size: 12px;
    color: var(--accent-ink);
  }
  #proto-bar .ct {
    height: 34px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #proto-bar b {
    font-weight: 600;
  }
  #proto-bar .sp {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  #proto-bar button {
    border: 1px solid var(--accent-line);
    border-radius: 980px;
    padding: 3px 11px;
    font-size: 11.5px;
    color: var(--accent-ink);
  }
  #proto-bar button[aria-pressed="true"] {
    background: var(--accent-ink);
    color: var(--accent-bg);
    border-color: var(--accent-ink);
  }

  /* ── 헤더 ── */
  header#hd {
    position: sticky;
    top: 34px;
    z-index: 50;
    background: color-mix(in srgb, var(--page) 92%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--hair);
  }
  #hd > .ct {
    height: 56px;
    display: flex;
    align-items: center;
    gap: 30px;
  }
  .logo {
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  #gnb {
    display: flex;
    gap: 22px;
    font-size: 13.5px;
  }
  #gnb > a {
    color: var(--ink-2);
    padding: 18px 0;
    position: relative;
  }
  #gnb > a:hover,
  #gnb > a.on {
    color: var(--ink);
  }
  #gnb > a.on::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--ink);
  }
  .hd-right {
    margin-left: auto;
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .hd-right .mini {
    font-size: 12.5px;
    color: var(--muted);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border-radius: 980px;
    border: 1px solid var(--hair);
    background: var(--card);
    padding: 7px 15px;
    font-size: 12.5px;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .btn:hover {
    border-color: var(--line);
  }
  .btn.solid {
    background: var(--ink);
    color: var(--page);
    border-color: var(--ink);
    font-weight: 600;
  }
  .btn.solid:hover {
    opacity: 0.86;
  }
  .btn.sm {
    padding: 5px 11px;
    font-size: 11.5px;
  }
  .btn.lg {
    padding: 10px 20px;
    font-size: 13.5px;
  }
  .btn.ghost {
    background: transparent;
    border-style: dashed;
    color: var(--faint);
    cursor: not-allowed;
  }
  .btn[aria-pressed="true"] {
    background: var(--ink);
    color: var(--page);
    border-color: var(--ink);
    font-weight: 600;
  }
  #burger {
    display: none;
  }

  /* 메가 */
  .mega {
    display: none;
    border-top: 1px solid var(--hair);
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .mega.open {
    display: block;
  }
  .mega .ct {
    padding: 32px;
    display: grid;
    gap: 44px;
    height: auto;
  }
  .mega.g3 .ct {
    grid-template-columns: 1.1fr 1fr 1fr;
  }
  .mega.g1 .ct {
    display: flex;
    gap: 44px;
    padding: 28px 32px;
    font-size: 14px;
  }
  .mlabel {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--faint);
    margin-bottom: 16px;
  }
  .mlist {
    display: grid;
    gap: 11px;
    font-size: 14px;
  }
  .mlist a:hover {
    color: var(--muted);
  }
  .mlist.two {
    grid-template-columns: 1fr 1fr;
    gap: 11px 20px;
  }
  .tagx {
    font-size: 10.5px;
    color: var(--faint);
    border: 1px solid var(--hair);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 8px;
  }

  /* 모바일 서랍 */
  #drawer {
    position: fixed;
    inset: 0;
    z-index: 70;
    background: var(--page);
    display: none;
    overflow: auto;
  }
  #drawer.open {
    display: block;
  }
  #drawer .ct {
    padding-top: 22px;
    padding-bottom: 60px;
  }
  .dr-top {
    display: flex;
    align-items: center;
    margin-bottom: 22px;
  }
  .acc {
    border-top: 1px solid var(--hair);
  }
  .acc > button {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    font-size: 15px;
    font-weight: 600;
  }
  .acc > div {
    display: none;
    padding: 0 0 14px;
    gap: 11px;
    grid-template-columns: 1fr;
  }
  .acc.open > div {
    display: grid;
  }
  .acc > div a {
    font-size: 14px;
    color: var(--ink-2);
  }

  /* ── 공통 파트 ── */
  main {
    min-height: 60vh;
  }
  section.blk {
    padding: 64px 0;
  }
  section.blk.tint {
    background: var(--band);
    border-top: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
  }
  section.blk.white {
    background: var(--card);
    border-top: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--faint);
  }
  .h2 {
    font-size: 31px;
    margin: 12px 0 0;
  }
  .lead {
    margin-top: 12px;
    color: var(--muted);
    max-width: 62ch;
    font-size: 15px;
  }
  .head-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  /* 와이어 프리미티브 */
  .bar {
    height: 7px;
    border-radius: 4px;
    background: var(--line);
    opacity: 0.5;
  }
  .bar.t {
    height: 15px;
    opacity: 0.85;
    border-radius: 5px;
  }
  .bar.lg {
    height: 22px;
  }
  .w90 {
    width: 90%;
  }
  .w75 {
    width: 75%;
  }
  .w60 {
    width: 60%;
  }
  .w50 {
    width: 50%;
  }
  .w40 {
    width: 40%;
  }
  .w30 {
    width: 30%;
  }
  .ph {
    border-radius: 10px;
    border: 1px solid var(--hair);
    background: var(--ph-2);
    min-height: 62px;
    display: grid;
    place-items: center;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.06em;
    background-image:
      linear-gradient(
        45deg,
        transparent calc(50% - 0.5px),
        var(--line) 50%,
        transparent calc(50% + 0.5px)
      ),
      linear-gradient(
        -45deg,
        transparent calc(50% - 0.5px),
        var(--line) 50%,
        transparent calc(50% + 0.5px)
      );
  }
  .card {
    border: 1px solid var(--hair);
    border-radius: 18px;
    background: var(--card);
    padding: 22px;
    display: grid;
    gap: 11px;
  }
  .card.flat {
    background: var(--band);
  }
  .card.pad0 {
    padding: 0;
    overflow: hidden;
  }
  .card .in {
    padding: 18px;
    display: grid;
    gap: 8px;
  }
  .grid {
    display: grid;
    gap: 14px;
  }
  .g2 {
    grid-template-columns: repeat(2, 1fr);
  }
  .g3 {
    grid-template-columns: repeat(3, 1fr);
  }
  .g4 {
    grid-template-columns: repeat(4, 1fr);
  }
  .g5 {
    grid-template-columns: repeat(5, 1fr);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
  }
  .split {
    display: grid;
    gap: 22px;
    align-items: start;
  }
  .stack {
    display: grid;
    gap: 10px;
  }
  .mini {
    font-size: 12.5px;
    color: var(--muted);
  }
  .note {
    border: 1px solid var(--accent-line);
    background: var(--accent-bg);
    border-radius: 12px;
    padding: 12px 15px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .note b {
    color: var(--accent-ink);
    font-weight: 600;
  }
  .lock {
    border: 1px solid var(--err-line);
    background: var(--err-bg);
    border-radius: 12px;
    padding: 12px 15px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .lock b {
    color: var(--err);
    font-weight: 600;
  }
  body:not(.notes) .lock,
  body:not(.notes) .note {
    display: none;
  }
  .hint {
    border: 1px solid var(--hair);
    background: var(--band);
    border-radius: 12px;
    padding: 12px 15px;
    font-size: 13px;
    color: var(--muted);
  }
  .hint b {
    color: var(--ink-2);
    font-weight: 600;
  }
  .dark {
    background: var(--dark);
    color: var(--onD);
  }
  .dark .eyebrow {
    color: var(--onD2);
  }
  .dark .bar {
    background: var(--onD);
    opacity: 0.3;
  }
  .dark .btn {
    background: transparent;
    border-color: var(--onDh);
    color: var(--onD);
  }
  .dark .btn.solid {
    background: var(--onD);
    color: var(--dark);
    border-color: var(--onD);
  }

  /* 스텝 */
  .steps {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 6px;
  }
  .dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid var(--hair);
    background: var(--card);
    color: var(--muted);
    flex: none;
  }
  .dot.on {
    background: var(--ink);
    color: var(--page);
    border-color: var(--ink);
  }
  .steps .ln {
    flex: 1;
    height: 2px;
    background: var(--line);
    opacity: 0.5;
  }
  .steps .ln.on {
    background: var(--ink);
    opacity: 1;
  }

  /* 폼 */
  .field {
    display: grid;
    gap: 7px;
  }
  .field label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
  }
  .field input,
  .field textarea {
    width: 100%;
    border: 1px solid var(--hair);
    border-radius: 11px;
    background: var(--card);
    padding: 11px 14px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
  }
  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--ink);
  }
  .field.bad input,
  .field.bad textarea {
    border-color: var(--err);
  }
  .err {
    font-size: 12px;
    color: var(--err);
  }
  .banner {
    border: 1px solid var(--err-line);
    background: var(--err-bg);
    color: var(--err);
    border-radius: 12px;
    padding: 12px 15px;
    font-size: 13.5px;
    display: none;
  }
  .banner.show {
    display: block;
  }

  /* 아코디언 FAQ */
  .faq {
    border: 1px solid var(--hair);
    border-radius: 14px;
    overflow: hidden;
    background: var(--card);
  }
  .faq .it + .it {
    border-top: 1px solid var(--hair-2);
  }
  .faq button {
    width: 100%;
    display: flex;
    justify-content: space-between;
    gap: 14px;
    align-items: center;
    padding: 15px 18px;
    text-align: left;
    font-size: 14px;
    font-weight: 600;
  }
  .faq .bd {
    display: none;
    padding: 0 18px 16px;
    gap: 8px;
  }
  .faq .it.open .bd {
    display: grid;
  }
  .faq .it.open button .cx {
    transform: rotate(45deg);
  }
  .cx {
    transition: transform 0.18s ease;
    color: var(--faint);
    flex: none;
  }

  /* 상태 */
  .state {
    border: 1px dashed var(--hair);
    border-radius: 14px;
    padding: 34px;
    display: grid;
    gap: 10px;
    place-items: center;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }
  .skel {
    display: grid;
    gap: 11px;
  }
  .skel .bar {
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,
    100% {
      opacity: 0.32;
    }
    50% {
      opacity: 0.62;
    }
  }

  /* 표 */
  .tbl {
    border: 1px solid var(--hair);
    border-radius: 14px;
    overflow: hidden;
    background: var(--card);
  }
  .tr {
    display: grid;
    grid-template-columns: 60px 1fr 96px;
    gap: 16px;
    padding: 13px 18px;
    align-items: center;
  }
  .tr + .tr {
    border-top: 1px solid var(--hair-2);
  }
  .tr.hd {
    background: var(--band);
    border-bottom: 1px solid var(--hair);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--faint);
  }
  .pg {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-top: 16px;
  }

  /* 플로팅 */
  #float {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 45;
    display: grid;
    gap: 9px;
    justify-items: end;
  }
  #float .fab {
    background: var(--ink);
    color: var(--page);
    border-radius: 980px;
    padding: 11px 18px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow);
  }
  #float .top {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--card);
    border: 1px solid var(--hair);
    color: var(--ink-2);
    box-shadow: var(--shadow);
  }

  /* 이벤트 로그 */
  #log {
    position: fixed;
    right: 22px;
    bottom: 96px;
    z-index: 46;
    width: 296px;
    max-height: 46vh;
    overflow: auto;
    background: var(--card);
    border: 1px solid var(--hair);
    border-radius: 14px;
    box-shadow: var(--shadow);
    display: none;
  }
  #log.open {
    display: block;
  }
  #log .lh {
    position: sticky;
    top: 0;
    background: var(--band);
    border-bottom: 1px solid var(--hair);
    padding: 9px 13px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--faint);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #log .li {
    padding: 8px 13px;
    font-size: 11.5px;
    border-top: 1px solid var(--hair-2);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink-2);
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  #log .li:first-of-type {
    border-top: 0;
  }
  #log .li span {
    color: var(--faint);
    flex: none;
  }
  #log .empty {
    padding: 16px 13px;
    font-size: 12px;
    color: var(--faint);
  }

  footer#ft {
    background: var(--band);
    border-top: 1px solid var(--hair);
    margin-top: 0;
  }
  #ft .ct {
    padding: 48px 32px 56px;
    display: grid;
    gap: 26px;
  }
  .ft-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr;
    gap: 32px;
  }
  .ft-grid .mlabel {
    margin-bottom: 12px;
  }
  .ft-grid a {
    font-size: 13.5px;
    color: var(--ink-2);
    display: block;
    margin-bottom: 9px;
  }
  .ft-b {
    border-top: 1px solid var(--hair);

        }

      });

    function bars(n, ws) {

    function q(s, r) {
      return (r || document).querySelector(s);

    /* ─────────── 이벤트 로그 ─────────── */
    window.dataLayer = window.dataLayer || [];
    var logBody = q("#logBody"),
      logCount = 0;
    function fire(name, extra) {
      if (!name) return;
      var payload = { event: name };
      if (extra) for (var k in extra) payload[k] = extra[k];
      window.dataLayer.push(payload);
      if (logCount === 0) logBody.innerHTML = "";
      logCount++;
      var d = new Date(),
        ts =
          ("0" + d.getHours()).slice(-2) +
          ":" +
          ("0" + d.getMinutes()).slice(-2) +
          ":" +
          ("0" + d.getSeconds()).slice(-2);
      var row = el(
        "div",
        { class: "li" },
        esc(name) + "<span>" + ts + "</span>",
      );
      logBody.insertBefore(row, logBody.firstChild);
      while (logBody.children.length > 40)
        logBody.removeChild(logBody.lastChild);
    }
    document.addEventListener("click", function (e) {
      var t = e.target.closest ? e.target.closest("[data-ev]") : null;
      if (t) fire(t.getAttribute("data-ev"));
    });

      var o = q("#log").classList.toggle("open");

    (function buildHeader() {

    };

    function render() {
      var h = (location.hash || "#/").replace(/^#/, "");
      var view = q("#view"),
        html;
      var m = h.match(/^\/business\/([a-z-]+)$/);
      if (m) html = pageBU(m[1]);
      else if (ROUTES[h]) html = ROUTES[h]();
      else html = page404();
      view.innerHTML = html;
      bind();
    }
    function bind() {
      // 필터 칩
      var cf = q("#caseFilter");
      if (cf)
        cf.addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (!b) return;
          qa("button", cf).forEach(function (x) {
            x.setAttribute("aria-pressed", "false");
          });
          b.setAttribute("aria-pressed", "true");
          fire("case_filter_click");
        });
      // FAQ
      var faq = q("#faq");
      if (faq)
        faq.addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (!b) return;
          b.parentNode.classList.toggle("open");
        });
      // 문의 유형
      var ct = q("#ctype");
      if (ct)
        ct.addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (!b) return;
          qa("button", ct).forEach(function (x) {
            x.setAttribute("aria-pressed", "false");
          });
          b.setAttribute("aria-pressed", "true");
          fire("contact_type_click");
        });
      // 폼
      var sub = q("#submit");
      if (sub)
        sub.addEventListener("click", function () {
          var ok = true;
          [
            [
              "name",
              "성명을 입력해 주세요.",
              function (v) {
                return !!v;
              },
            ],
            [
              "phone",
              "올바른 휴대폰 번호를 입력해 주세요.",
              function (v) {
                return v.replace(/\D/g, "").length >= 10;
              },
            ],
            [
              "email",
              "올바른 이메일 주소를 입력해 주세요.",
              function (v) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
              },
            ],
            [
              "company",
              "회사명을 입력해 주세요.",
              function (v) {
                return !!v;
              },
            ],
          ].forEach(function (f) {
            var wrap = q('.field[data-f="' + f[0] + '"]'),
              inp = q("#f-" + f[0]);
            var old = q(".err", wrap);
            if (old) old.remove();
            wrap.classList.remove("bad");
            if (!f[2](inp.value.trim())) {
              ok = false;
              wrap.classList.add("bad");
              wrap.appendChild(el("div", { class: "err" }, f[1]));
            }
          });
          if (!ok) {
            fire("contact_validation_error");
            return;
          }
          fire("generate_lead", {
            lead_category: q('#ctype [aria-pressed="true"]').textContent,
          });
          q("#s1").style.display = "none";
          q("#s2").style.display = "block";
          q("#d2").classList.add("on");
          q("#ln").classList.add("on");
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      var ph = q("#f-phone");
      if (ph)
        ph.addEventListener("input", function () {
          var d = this.value.replace(/\D/g, "").slice(0, 11),
            v = d;
          if (d.length > 7)
            v = d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7);
          else if (d.length > 3) v = d.slice(0, 3) + "-" + d.slice(3);
          this.value = v;
        });
    }
    window.addEventListener("hashchange", function () {
      render();
      window.scrollTo({ top: 0 });
    });
    render();
  })();
</script>
