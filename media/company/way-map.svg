<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-labelledby="waymap-title waymap-desc">
  <title id="waymap-title">솔트웨어 본사 안내도</title>
  <desc id="waymap-desc">경기도 과천시 과천대로12길 117 과천펜타원 G동. 북쪽으로 1,500m 거리에 4호선 정부과천청사역, 서쪽으로 650m 거리에 찬우물 버스 정류장이 있습니다.</desc>

  <!--
    가로 약도 — /company/location 의 지도 판(사령관 2026-09-13 "가로 약도 새로 만들기").
    앞 장(way-map.png · 700×800 세로)은 액자를 가로로 못 채워 가운데 455px 만 차지했다.

    자리는 눈대중이 아니라 실측 좌표에서 나온 방위다(2026-09-13):
      솔트웨어(과천펜타원)  37.4154243, 126.9908405   기준
      정부과천청사역        37.4265023, 126.9897784   북 1,233m · 서 94m
      찬우물 정류장         37.4153824, 126.9839069   서 613m · 남 5m
    그래서 청사역은 위(북)에, 찬우물은 왼쪽(서)에 거의 같은 높이로 선다.
    거리·도보 시간 글자는 회사가 공개한 값이다(saltware.co.kr/company/way) —
    직선거리(1,237m · 613m)가 아니라 걸어가는 거리라 수가 다르다.

    축척은 맞추지 않았다. 실축척이면 남북 1,233m 와 동서 613m 가 2:1 세로라 가로 액자를
    또 못 채운다. 방위만 지키고 거리는 글자로 적는 것이 안내도의 규약이라 그렇게 했다.

    색은 CSS 토큰을 쓸 수 없다 — 이 파일은 <img> 로 실려 지면의 스타일시트를 못 본다.
    tokens.css 의 값과 같은 색을 직접 적는다(바뀌면 여기도 고친다):
      바닥 #f5f5f7(토큰 c-neutral-100) · 길 #d2d2d7(토큰 c-neutral-300) · 글 #1d1d1f / #6e6e73
      브랜드 #f49f20(토큰 c-brand-dot) · 짙은 쪽 #e8811a(토큰 c-brand-dot-deep)
  -->

  <defs>
    <style>
      .t { font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, "Noto Sans KR", sans-serif; }
      .name { font-size: 26px; font-weight: 700; fill: #1d1d1f; }
      .here { font-size: 30px; font-weight: 700; fill: #1d1d1f; }
      .sub  { font-size: 20px; font-weight: 600; fill: #6e6e73; }
      .dist { font-size: 20px; font-weight: 700; fill: #8a4400; }
      .road { font-size: 19px; font-weight: 600; fill: #86868b; }
    </style>
  </defs>

  <rect width="1600" height="620" fill="#f5f5f7" />

  <!-- 길. 과천대로가 찬우물을 지나 북쪽으로 뻗고, 과천대로12길이 펜타원으로 갈라진다
       (찬우물은 과천대로 위의 정류장이고 본사 주소가 과천대로12길이다). -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 470 H520 Q700 470 790 360 L980 120 H1540" stroke="#e8e8ed" stroke-width="46" />
    <path d="M60 470 H520 Q700 470 790 360 L980 120 H1540" stroke="#d2d2d7" stroke-width="34" />
    <path d="M905 218 L1145 400" stroke="#e8e8ed" stroke-width="30" />
    <path d="M905 218 L1145 400" stroke="#d2d2d7" stroke-width="20" />
  </g>
  <text class="t road" x="150" y="440" text-anchor="middle">과천대로</text>
  <text class="t road" x="1010" y="290" transform="rotate(37 1010 290)" text-anchor="middle">과천대로12길</text>

  <!-- 걸어가는 거리. 점선이라 길이 아니라 '이만큼 걷는다'로 읽힌다. -->
  <g fill="none" stroke="#f49f20" stroke-width="3" stroke-dasharray="10 9" stroke-linecap="round">
    <path d="M344 430 H1120" />
    <path d="M1170 360 V150" />
  </g>
  <g class="t" text-anchor="middle">
    <rect x="580" y="404" width="262" height="34" rx="8" fill="#f5f5f7" />
    <text class="dist" x="711" y="429">650m · 도보 10분</text>
    <rect x="1040" y="238" width="262" height="34" rx="8" fill="#f5f5f7" />
    <text class="dist" x="1171" y="263">1,500m · 도보 25분</text>
  </g>

  <!-- 정부과천청사역 — 북쪽 -->
  <g transform="translate(1170 110)">
    <circle r="30" fill="#ffffff" stroke="#d2d2d7" stroke-width="2" />
    <path d="M-11 -13 h22 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-22 a4 4 0 0 1 -4 -4 v-16 a4 4 0 0 1 4 -4 z" fill="none" stroke="#6e6e73" stroke-width="2.5" />
    <path d="M-11 -3 h26" stroke="#6e6e73" stroke-width="2.5" />
    <path d="M-8 14 l-5 7 M8 14 l5 7" stroke="#6e6e73" stroke-width="2.5" stroke-linecap="round" />
    <text class="t name" x="0" y="-58" text-anchor="middle">정부과천청사역</text>
    <text class="t sub" x="0" y="-32" text-anchor="middle">4호선 · 5번 출구</text>
  </g>

  <!-- 찬우물 정류장 — 서쪽 -->
  <g transform="translate(300 430)">
    <circle r="30" fill="#ffffff" stroke="#d2d2d7" stroke-width="2" />
    <path d="M-15 -12 h30 a3 3 0 0 1 3 3 v17 a3 3 0 0 1 -3 3 h-30 a3 3 0 0 1 -3 -3 v-17 a3 3 0 0 1 3 -3 z" fill="none" stroke="#6e6e73" stroke-width="2.5" />
    <path d="M-15 -2 h36" stroke="#6e6e73" stroke-width="2.5" />
    <circle cx="-9" cy="16" r="4" fill="#6e6e73" />
    <circle cx="9" cy="16" r="4" fill="#6e6e73" />
    <text class="t name" x="0" y="86" text-anchor="middle">찬우물 정류장</text>
  </g>

  <!-- 솔트웨어 — 이 지면이 가리키는 곳. 한 점만 브랜드 색이다. -->
  <g transform="translate(1170 430)">
    <path d="M0 22 C-26 -8 -34 -20 -34 -32 A34 34 0 0 1 34 -32 C34 -20 26 -8 0 22 Z" fill="#f49f20" stroke="#e8811a" stroke-width="2" />
    <circle cy="-32" r="12" fill="#ffffff" />
    <text class="t here" x="0" y="66" text-anchor="middle">솔트웨어</text>
    <text class="t sub" x="0" y="96" text-anchor="middle">과천펜타원 G동 7층</text>
  </g>

  <!-- 방위. 축척을 맞추지 않았으므로 어느 쪽이 북인지는 적어 둔다. -->
  <g transform="translate(96 110)">
    <circle r="34" fill="#ffffff" stroke="#e8e8ed" stroke-width="2" />
    <path d="M0 -20 L9 8 L0 1 L-9 8 Z" fill="#6e6e73" />
    <text class="t" x="0" y="27" text-anchor="middle" font-size="16" font-weight="700" fill="#6e6e73">N</text>
  </g>
</svg>
